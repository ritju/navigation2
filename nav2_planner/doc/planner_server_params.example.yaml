planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0   # 期望规划频率 (Hz)，超时只打 WARN
    use_sim_time: true                 # 仿真时钟
    planner_plugins: ["GridBased"]     # 加载的全局规划插件名

    # ---------- FastPath 走廊（只认 254）----------
    enable_straight_expand: false       # FastPath 直线走廊总开关；false 则只 snap 后交给 Hybrid
    goal_occupied_tolerance: 1.0       # 目标 254 占用时环搜半径 (m)
    goal_search_resolution: 0.2        # 环搜步长 (m)
    straight_check_length_ratio: 0.5   # 中心线加深窗口下限相对车长
    straight_path_resolution: 0.1      # 直线路径点间距 (m)

    # ---------- through-poses 弱引导 ----------
    rewrite_via_yaw_to_approach: true  # 总开关。true：仅多点近段中间 via 改成 S→G 来向；单点/最后一点/远段不改。false：全部保留原 yaw
    near_distance_threshold: 2.0       # 近段距离阈值；远段中间 via 禁止转线。航向门禁/裁尾/丢 via 只看该距离，不看 yaw
    near_yaw_threshold: 0.35           # 近段转线/伸缩用的航向差 (rad)；不用于 Hybrid 到达/裁尾
    via_heading_tolerance: 0.35        # Hybrid 近段中间 via 到达与航向裁尾的 |Δψ| (rad)；单点/最后一段不开搜索门禁
    via_heading_trim_length: 1.0       # 航向裁尾最大累计弧长 (m)；从终点往回，超出不再裁
    enable_line_stretch: true          # 终点邻域 254 时沿射线缩短 G；最后一段远距离也允许
    line_stretch_max: 0.4
    line_stretch_goal_window: 0.8
    line_stretch_allow_extend: false
    enable_line_rotate: true           # 近段单侧转线；远段关闭；最后一段仍仅近段转线
    line_rotate_max_iters: 5
    line_rotate_goal_shift_tol: 0.5
    corridor_intrusion_tol: 0.4       # 单侧 254 最大侵入；小于该值且对侧净空>=车宽则接受原直线

    # ---------- RViz：planning_debug/* ----------
    publish_planning_debug: false       # 发布调试 Path/Marker；false 则只打日志
    planning_debug_keep_mode: session  # session=一次规划结束整包发出全部 via（Hybrid 各段异色）；current=只显示当前段
    planning_debug_footprint_stride: 0 # session 下默认不沿路画 footprint（避免糊屏）；>0 则按步长累加

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                      # 终点 XY 容差 (m)；近段另加 via_heading_tolerance，本项先不收紧
      downsample_costmap: false           # 是否降采样代价地图再搜
      downsampling_factor: 1              # 降采样倍数（地图分辨率×该值）
      allow_unknown: true                 # 允许走未知区域
      max_iterations: 10000000            # 搜索最大迭代；-1 不限制
      max_on_approach_iterations: 1000    # 进入 XY 容差后继续逼近的最大迭代
      max_planning_time: 15.0             # 规划+平滑总时限 (s)
      enable_close_range_roi_budget: true # ROI 八连通短路径短于阈值时，改用近距时限/迭代
      close_range_roi_margin: 5.0         # ROI 相对起终点包围盒外扩 (m)
      close_range_threshold: 5.0          # ROI 最短路小于该值 (m) 视为近距
      close_range_max_planning_time: 0.5  # 近距规划时限 (s)
      close_range_max_iterations: 1000000 # 近距最大迭代；<=0 表示与 max_iterations 相同
      motion_model_for_search: "DUBIN"    # DUBIN 不能倒车；倒车用 REEDS_SHEPP
      angle_quantization_bins: 72         # 航向离散份数
      analytic_expansion_ratio: 3.5       # 解析展开尝试频率
      analytic_expansion_max_length: 5.0  # 解析展开最大长度 (m)，过短易绕圈捷径
      minimum_turning_radius: 0.1         # 最小转弯半径 (m)；差速上是舒适半径不是物理极限
      reverse_penalty: 2.1                # 倒车代价倍数（REEDS_SHEPP），须 >= 1
      change_penalty: 0.2                 # 切换左右转的惩罚，>= 0
      non_straight_penalty: 1.20          # 非直行惩罚，须 >= 1
      cost_penalty: 3.5                   # 启发里对高代价区的惩罚，越大越靠通道中心（约 1.3～3.5）
      retrospective_penalty: 0.025        # 偏好后段机动，加速搜索；0～1
      lookup_table_size: 20.0             # Dubins 距离缓存窗口 (m)
      cache_obstacle_heuristic: true      # 同一目标缓存障碍启发，静态图重规划可快一个数量级
      smooth_path: true                   # 是否平滑 Hybrid 路径
      smoother:
        max_iterations: 1000              # 平滑迭代上限
        w_smooth: 0.3                     # 平滑项权重
        w_data: 0.2                       # 贴合原路径权重
        tolerance: 1.0e-10                # 平滑收敛阈值
        do_refinement: true               # 对结果再递归平滑 3 次
      tail_trim_length: 1.0               # Hybrid 尾裁窗口 (m)：从终点沿路径往回，按车长抽点；中心线 cost<253 才保留（255 跳过）
